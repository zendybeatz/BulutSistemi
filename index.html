<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel / Ortak Yönetim Paneli</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b; /* zinc-950 */
            color: #d4d4d8; /* zinc-300 */
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
        
        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 selection:bg-zinc-800">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-zinc-800/50 pb-6">
            <div>
                <h1 class="text-2xl font-semibold text-zinc-100">Yönetim Paneli</h1>
                <p class="text-sm text-zinc-500 mt-1">Gerçek zamanlı bulut takip aracı</p>
            </div>
            <div id="sync-status" class="flex items-center gap-2 text-xs font-medium bg-zinc-900/50 px-3 py-1.5 rounded-full border border-zinc-800/50 w-fit transition-colors">
                <i data-lucide="loader-2" class="w-4 h-4 text-zinc-400 animate-spin"></i>
                Bağlanıyor...
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- TASKS COLUMN -->
            <div class="bg-zinc-900/30 border border-zinc-800/50 rounded-2xl p-6 flex flex-col h-[600px]">
                <h2 class="text-lg font-medium text-zinc-100 mb-6 flex items-center gap-2">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-zinc-400"></i>
                    Görevler
                </h2>

                <!-- Add Task Form -->
                <form id="task-form" class="flex gap-2 mb-6">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="Yeni görev ekle..."
                        class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors"
                        autocomplete="off"
                    />
                    <button 
                        type="submit"
                        id="task-submit-btn"
                        disabled
                        class="bg-zinc-100 text-zinc-900 px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                    >
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </form>

                <!-- Task List -->
                <div id="task-list" class="flex-1 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                    <!-- Tasks will be injected here by JS -->
                </div>
            </div>

            <!-- FINANCE COLUMN -->
            <div class="bg-zinc-900/30 border border-zinc-800/50 rounded-2xl p-6 flex flex-col h-[600px]">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-medium text-zinc-100 flex items-center gap-2">
                        <i data-lucide="wallet" class="w-5 h-5 text-zinc-400"></i>
                        İşletme Finans
                    </h2>
                    <div id="total-balance" class="text-lg font-medium text-zinc-400">
                        Net: 0 ₺
                    </div>
                </div>

                <!-- Add Transaction Form -->
                <form id="tx-form" class="flex flex-col gap-3 mb-4 bg-zinc-900/50 p-4 rounded-xl border border-zinc-800/50">
                    <div class="flex gap-2">
                        <button
                            type="button"
                            id="type-income"
                            class="flex-1 py-2 text-xs font-medium rounded-lg border transition-colors flex items-center justify-center gap-1 bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-zinc-300"
                        >
                            <i data-lucide="arrow-up-right" class="w-3 h-3"></i> Gelir (Alınan)
                        </button>
                        <button
                            type="button"
                            id="type-expense"
                            class="flex-1 py-2 text-xs font-medium rounded-lg border transition-colors flex items-center justify-center gap-1 bg-red-500/10 border-red-500/30 text-red-400"
                        >
                            <i data-lucide="arrow-down-right" class="w-3 h-3"></i> Gider (Yapılan)
                        </button>
                    </div>
                    
                    <input
                        type="text"
                        id="tx-business"
                        placeholder="İşletme / Müşteri Adı (Örn: A İşletmesi)"
                        class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors"
                        autocomplete="off"
                    />
                    
                    <div class="flex gap-2">
                        <input
                            type="text"
                            id="tx-desc"
                            placeholder="Açıklama (Örn: 1. Taksit)"
                            class="flex-[2] bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors"
                            autocomplete="off"
                        />
                        <input
                            type="number"
                            id="tx-amount"
                            placeholder="Miktar"
                            min="0"
                            step="0.01"
                            class="flex-[1.5] bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors"
                            autocomplete="off"
                        />
                        <button 
                            type="submit"
                            id="tx-submit-btn"
                            disabled
                            class="bg-zinc-100 text-zinc-900 px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex-shrink-0"
                        >
                            <i data-lucide="plus" class="w-5 h-5"></i>
                        </button>
                    </div>
                </form>

                <!-- Transaction List -->
                <div id="tx-list" class="flex-1 overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                    <!-- Transactions will be injected here by JS -->
                </div>

                <!-- Footer Totals -->
                <div class="mt-4 pt-4 border-t border-zinc-800/50 flex justify-between items-center bg-zinc-900/50 p-3 rounded-xl">
                    <div>
                        <div class="text-xs text-zinc-500 mb-1">Toplam Gelir</div>
                        <div id="total-income" class="text-emerald-400 font-semibold text-lg">0 ₺</div>
                    </div>
                    <div class="w-px h-8 bg-zinc-800/50"></div>
                    <div class="text-right">
                        <div class="text-xs text-zinc-500 mb-1">Toplam Gider</div>
                        <div id="total-expense" class="text-red-400 font-semibold text-lg">0 ₺</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Platform Environment)
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { projectId: "demo-project" }; // Sadece test/önizleme için
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'minimal-collab-dashboard';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- State Management ---
        let user = null;
        let tasks = [];
        let transactions = [];
        let currentTxType = 'income'; // default changed to income

        // --- DOM Elements ---
        const taskInput = document.getElementById('task-input');
        const taskSubmitBtn = document.getElementById('task-submit-btn');
        const taskForm = document.getElementById('task-form');
        const taskList = document.getElementById('task-list');

        const txBusiness = document.getElementById('tx-business');
        const txDesc = document.getElementById('tx-desc');
        const txAmount = document.getElementById('tx-amount');
        const txSubmitBtn = document.getElementById('tx-submit-btn');
        const txForm = document.getElementById('tx-form');
        const txList = document.getElementById('tx-list');
        const typeIncomeBtn = document.getElementById('type-income');
        const typeExpenseBtn = document.getElementById('type-expense');
        const totalBalanceEl = document.getElementById('total-balance');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const syncStatusEl = document.getElementById('sync-status');

        // --- Init Auth & Database ---
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
            }
        }

        onAuthStateChanged(auth, (currentUser) => {
            if (currentUser) {
                user = currentUser;
                syncStatusEl.innerHTML = `<i data-lucide="cloud-lightning" class="w-4 h-4 text-emerald-400"></i> Bulut Senkronize`;
                syncStatusEl.classList.add('border-emerald-500/30', 'bg-emerald-500/10');
                lucide.createIcons();
                setupRealtimeListeners();
            }
        });

        initApp();

        function setupRealtimeListeners() {
            const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
            const txRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');

            onSnapshot(tasksRef, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTasks();
            }, (error) => console.error("Tasks error:", error));

            onSnapshot(txRef, (snapshot) => {
                transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTransactions();
            }, (error) => console.error("Transactions error:", error));
        }

        // --- Tasks Logic ---
        function renderTasks() {
            if (tasks.length === 0) {
                taskList.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-zinc-600 text-sm">Görev listesi boş.</div>`;
                return;
            }

            // Hafızada sıralama (Firestore karmaşık sorgu kuralları gereği)
            const sortedTasks = [...tasks].sort((a, b) => {
                if (a.completed === b.completed) return b.createdAt - a.createdAt;
                return a.completed ? 1 : -1;
            });

            taskList.innerHTML = sortedTasks.map(task => `
                <div class="group flex items-center justify-between p-3 rounded-xl hover:bg-zinc-900/50 border border-transparent hover:border-zinc-800/50 transition-all">
                    <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleTask('${task.id}', ${task.completed})">
                        <button class="text-zinc-500 hover:text-zinc-300 transition-colors flex-shrink-0">
                            ${task.completed 
                                ? `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500"></i>` 
                                : `<i data-lucide="circle" class="w-5 h-5"></i>`}
                        </button>
                        <span class="text-sm select-none transition-all ${task.completed ? 'text-zinc-600 line-through' : 'text-zinc-300'}">
                            ${task.text}
                        </span>
                    </div>
                    <button onclick="deleteTask('${task.id}')" class="text-zinc-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        taskInput.addEventListener('input', (e) => {
            taskSubmitBtn.disabled = !e.target.value.trim();
        });

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text || !user) return;
            
            taskInput.value = '';
            taskSubmitBtn.disabled = true;

            try {
                const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'tasks');
                await addDoc(tasksRef, {
                    text,
                    completed: false,
                    createdAt: Date.now(),
                    createdBy: user.uid
                });
            } catch (err) { console.error(err); }
        });

        window.toggleTask = async (id, currentStatus) => {
            if (!user) return;
            try {
                const taskDoc = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', id);
                await updateDoc(taskDoc, { completed: !currentStatus });
            } catch (err) { console.error(err); }
        };

        window.deleteTask = async (id) => {
            if (!user) return;
            try {
                const taskDoc = doc(db, 'artifacts', appId, 'public', 'data', 'tasks', id);
                await deleteDoc(taskDoc);
            } catch (err) { console.error(err); }
        };

        // --- Finances Logic ---
        function updateTxTypeUI() {
            if (currentTxType === 'income') {
                typeIncomeBtn.className = 'flex-1 py-2 text-xs font-medium rounded-lg border transition-colors flex items-center justify-center gap-1 bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
                typeExpenseBtn.className = 'flex-1 py-2 text-xs font-medium rounded-lg border transition-colors flex items-center justify-center gap-1 bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-zinc-300';
            } else {
                typeIncomeBtn.className = 'flex-1 py-2 text-xs font-medium rounded-lg border transition-colors flex items-center justify-center gap-1 bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-zinc-300';
                typeExpenseBtn.className = 'flex-1 py-2 text-xs font-medium rounded-lg border transition-colors flex items-center justify-center gap-1 bg-red-500/10 border-red-500/30 text-red-400';
            }
        }

        typeIncomeBtn.addEventListener('click', () => { currentTxType = 'income'; updateTxTypeUI(); });
        typeExpenseBtn.addEventListener('click', () => { currentTxType = 'expense'; updateTxTypeUI(); });

        function validateTxForm() {
            txSubmitBtn.disabled = !txBusiness.value.trim() || !txAmount.value || parseFloat(txAmount.value) <= 0;
        }

        txBusiness.addEventListener('input', validateTxForm);
        txDesc.addEventListener('input', validateTxForm);
        txAmount.addEventListener('input', validateTxForm);

        function renderTransactions() {
            // Calculate Totals
            let tIncome = 0;
            let tExpense = 0;
            
            transactions.forEach(tx => {
                if (tx.type === 'income') tIncome += tx.amount;
                else tExpense += tx.amount;
            });

            const netTotal = tIncome - tExpense;

            // Update UI Totals
            totalBalanceEl.textContent = `Net: ${netTotal >= 0 ? '+' : ''}${netTotal.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits:2})} ₺`;
            totalBalanceEl.className = `text-lg font-medium ${netTotal >= 0 ? 'text-emerald-400' : 'text-zinc-400'}`;
            
            totalIncomeEl.textContent = `${tIncome.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits:2})} ₺`;
            totalExpenseEl.textContent = `${tExpense.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits:2})} ₺`;

            // Render List
            if (transactions.length === 0) {
                txList.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-zinc-600 text-sm">Henüz işlem eklenmedi.</div>`;
                return;
            }

            const sortedTx = [...transactions].sort((a, b) => b.createdAt - a.createdAt);

            txList.innerHTML = sortedTx.map(tx => `
                <div class="group flex items-center justify-between p-3 rounded-xl hover:bg-zinc-900/50 border border-transparent hover:border-zinc-800/50 transition-all">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="p-2 rounded-lg flex-shrink-0 ${tx.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}">
                            <i data-lucide="${tx.type === 'income' ? 'arrow-up-right' : 'arrow-down-right'}" class="w-4 h-4"></i>
                        </div>
                        <div class="flex flex-col truncate">
                            <span class="text-sm font-medium text-zinc-200 truncate">${tx.businessName}</span>
                            ${tx.description ? `<span class="text-xs text-zinc-500 truncate">${tx.description}</span>` : ''}
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 pl-2 flex-shrink-0">
                        <span class="text-sm font-medium ${tx.type === 'income' ? 'text-emerald-400' : 'text-zinc-400'}">
                            ${tx.type === 'income' ? '+' : '-'}${tx.amount.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits:2})} ₺
                        </span>
                        <button onclick="deleteTransaction('${tx.id}')" class="text-zinc-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        txForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const business = txBusiness.value.trim();
            const desc = txDesc.value.trim();
            const amount = parseFloat(txAmount.value);

            if (!business || isNaN(amount) || amount <= 0 || !user) return;
            
            // Sadece başarılı eklemeden sonra inputları temizle
            txBusiness.value = '';
            txDesc.value = '';
            txAmount.value = '';
            validateTxForm();

            try {
                const txRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');
                await addDoc(txRef, {
                    businessName: business,
                    description: desc,
                    amount: amount,
                    type: currentTxType,
                    createdAt: Date.now(),
                    createdBy: user.uid
                });
            } catch(err) { console.error(err); }
        });

        window.deleteTransaction = async (id) => {
            if (!user) return;
            try {
                const txDoc = doc(db, 'artifacts', appId, 'public', 'data', 'transactions', id);
                await deleteDoc(txDoc);
            } catch(err) { console.error(err); }
        };

        // --- Initialize UI ---
        lucide.createIcons();
        updateTxTypeUI();
        renderTasks();
        renderTransactions();
    </script>
</body>
</html>
